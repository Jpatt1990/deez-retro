name: iOS core build

# Paste this whole file into
#   https://github.com/Jpatt1990/deez-retro/new/main/.github/workflows/ios-core-build.yml
# or overwrite the generic ios.yml with it. All build and verification logic
# lives in scripts/ci-ios-build.sh, which is already on main.

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  core:
    name: Flycast core -> arm64-apple-ios
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Build and verify the interpreter-only arm64 iOS core library
        run: bash scripts/ci-ios-build.sh core

      - name: Upload libflycast.a and the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flycast-ios-core
          path: |
            build/configure.log
            build/build.log
            build/flycast-ios/**/libflycast.a
          if-no-files-found: warn
          retention-days: 30
