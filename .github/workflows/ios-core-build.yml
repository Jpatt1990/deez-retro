# ios-core-build.yml
#
# Route B: produce REAL arm64 iPadOS build logs and artifacts without owning a Mac.
#
# The actual build and verification logic lives in scripts/ci-ios-build.sh, not
# here. Reasons:
#   * it can be linted (shellcheck) and reviewed as ordinary code
#   * a local Mac runs exactly what CI runs, so results cannot diverge
#   * this file stays small enough to audit at a glance
#
# JOBS
#   core  Flycast's core -> arm64-apple-ios, interpreter-only, as libflycast.a,
#         with architecture and symbol verification and an assertion that
#         TARGET_NO_REC really disabled the recompilers
#   sim   the same core for the iOS simulator, to catch arch-conditional breakage
#   app   the SwiftUI app compiles and links for simulator and unsigned device
#   link  the engine linked into the app (beyond the stated milestone)
#
# WHAT A GREEN RUN PROVES: the artifacts build.
# WHAT IT DOES NOT PROVE: that the emulator boots, renders, has audio, or
# performs adequately. Only a physical iPad can establish that.
# See docs/PHASE2-BUILD-REPORT.md.

name: iOS core build

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - 'patches/**'
      - 'project.yml'
      - 'App/**'
      - 'Bridge/**'
      - 'JIT/**'
      - 'Tests/**'
      - '.github/workflows/ios-core-build.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'patches/**'
      - 'project.yml'
      - 'App/**'
      - 'Bridge/**'
      - 'JIT/**'
      - 'Tests/**'

env:
  FLYCAST_SHA: ed953fcbfdd1b8a7521d2966b13cc700c7e2d233
  DEEZRETRO_WORK: ${{ github.workspace }}/build
  # CMake is PINNED TO 3.x ON PURPOSE. Do not "simplify" this to `brew install
  # cmake`: GitHub's macOS runners ship CMake 4.x, and CMake 4 removed
  # compatibility with cmake_minimum_required(VERSION < 3.5). Flycast's bundled
  # core/deps/libchdr/deps/zlib-1.3.1/CMakeLists.txt declares
  # `cmake_minimum_required(VERSION 2.4.4...3.15.0)`, and that dependency is
  # added whenever WITH_SYSTEM_ZLIB is not already set (Flycast CMakeLists:583).
  # Reproduced locally: CMake 4.4.4 failed, CMake 3.31.6 succeeded.
  CMAKE_VERSION: 3.31.6

jobs:
  core:
    name: Flycast core -> arm64-apple-ios
    runs-on: macos-15
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Pin CMake ${{ env.CMAKE_VERSION }}
        run: |
          set -euo pipefail
          url="https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-macos-universal.tar.gz"
          curl -fsSL "$url" -o /tmp/cmake.tar.gz
          mkdir -p "$HOME/toolchain"
          tar -xzf /tmp/cmake.tar.gz -C "$HOME/toolchain"
          echo "$HOME/toolchain/cmake-${CMAKE_VERSION}-macos-universal/CMake.app/Contents/bin" >> "$GITHUB_PATH"

      - name: Toolchain versions
        run: |
          set -x
          sw_vers
          xcodebuild -version
          cmake --version
          sysctl -n hw.ncpu

      - name: Build and verify the core library
        run: mkdir -p "$DEEZRETRO_WORK" && bash scripts/ci-ios-build.sh core

      - name: Upload logs, library, and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flycast-ios-core
          path: |
            build/configure.log
            build/build.log
            build/flycast-ios/**/libflycast.a
          if-no-files-found: warn
          retention-days: 30

  sim:
    name: Flycast core -> iOS simulator
    runs-on: macos-15
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Pin CMake ${{ env.CMAKE_VERSION }}
        run: |
          set -euo pipefail
          url="https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-macos-universal.tar.gz"
          curl -fsSL "$url" -o /tmp/cmake.tar.gz
          mkdir -p "$HOME/toolchain"
          tar -xzf /tmp/cmake.tar.gz -C "$HOME/toolchain"
          echo "$HOME/toolchain/cmake-${CMAKE_VERSION}-macos-universal/CMake.app/Contents/bin" >> "$GITHUB_PATH"

      - name: Build the simulator core
        run: mkdir -p "$DEEZRETRO_WORK" && bash scripts/ci-ios-build.sh sim

      - name: Upload simulator logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flycast-ios-sim
          path: |
            build/configure-sim.log
            build/build-sim.log
            build/flycast-sim/**/libflycast.a
          if-no-files-found: warn

  app:
    name: DeezRetro app (simulator + arm64 device, unsigned)
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned engines (needed for bridge header paths)
        run: |
          set -euo pipefail
          mkdir -p "$DEEZRETRO_WORK"
          bash scripts/fetch-engines.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build and verify the app
        run: bash scripts/ci-ios-build.sh app

      - name: Upload app logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deezretro-app-logs
          path: build/app-*.log
          if-no-files-found: warn

  # Beyond the stated milestone: linking the engine is the next task. Allowed to
  # fail so it cannot hide the `core` and `app` results, but its logs are kept
  # because they are exactly what the next fix needs.
  link:
    name: Link engine into app
    runs-on: macos-15
    timeout-minutes: 60
    needs: [core, app]
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned engines
        run: |
          set -euo pipefail
          mkdir -p "$DEEZRETRO_WORK"
          bash scripts/fetch-engines.sh

      - name: Download the built core library
        uses: actions/download-artifact@v4
        with:
          name: flycast-ios-core
          path: build/core-artifact

      - name: Locate libflycast.a
        id: locate
        run: |
          set -euo pipefail
          lib="$(find build/core-artifact -name 'libflycast.a' -path '*iphoneos*' -print -quit)"
          if [ -z "$lib" ]; then
            lib="$(find build/core-artifact -name 'libflycast.a' -print -quit)"
          fi
          if [ -z "$lib" ]; then
            echo "::error::no libflycast.a in the artifact"
            find build/core-artifact -type f | head -40
            exit 1
          fi
          echo "lib=$lib"
          lipo -info "$lib"
          echo "lib_path=$lib" >> "$GITHUB_OUTPUT"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Link and build
        run: bash scripts/ci-ios-build.sh link "$PWD/${{ steps.locate.outputs.lib_path }}"

      - name: Upload link log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deezretro-link-log
          path: build/app-linked.log
          if-no-files-found: warn
